<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tool Troubleshooting & Error Fix Hub</title>
  <meta
    name="description"
    content="Find fast, SEO-friendly troubleshooting guides for AI Studio, ChatGPT, Claude, and developer API errors in one lightweight Docsify documentation hub."
  />
  <meta
    name="keywords"
    content="AI tool errors, AI troubleshooting, Google AI Studio errors, OpenAI errors, Claude errors, API SDK fixes"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI Tool Troubleshooting & Error Fix Hub" />
  <meta
    property="og:description"
    content="A lightweight Docsify knowledge base for fixing common AI tool, SDK, and API error messages quickly."
  />
  <meta property="og:url" content="https://arundamo.github.io/aifixhub/" />
  <link rel="canonical" href="https://arundamo.github.io/aifixhub/" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.9.4/lib/themes/dark.css" integrity="sha384-y8uIslWj7+HYtqaIKbvT+aiHzqldCflDIEyhohA8iQndkDMtyaAJF3QbUyY7LGGS" crossorigin="anonymous" />
  <style>
    :root {
      color-scheme: dark;
      --page-max-width: 1100px;
    }

    body {
      background: #0d1117;
      color: #c9d1d9;
    }

    .app-nav,
    .sidebar,
    .content {
      font-size: 16px;
    }

    .markdown-section {
      max-width: var(--page-max-width);
    }

    .markdown-section a {
      color: #58a6ff;
    }

    .search input {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }

    .sidebar {
      background: #010409;
      border-right: 1px solid #30363d;
    }

    .app-nav {
      background: rgba(13, 17, 23, 0.95);
    }

    @media (max-width: 768px) {
      .markdown-section {
        padding: 1.5rem 1rem 3rem;
      }
    }
  </style>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TechArticle",
      "headline": "AI Tool Troubleshooting & Error Fix Hub",
      "description": "Find practical, search-friendly fixes for AI Studio, ChatGPT, Claude, and API troubleshooting issues.",
      "url": "https://arundamo.github.io/aifixhub/",
      "mainEntityOfPage": "https://arundamo.github.io/aifixhub/",
      "author": {
        "@type": "Organization",
        "name": "AIFixHub"
      },
      "about": [
        "AI troubleshooting",
        "API error fixes",
        "LLM documentation"
      ]
    }
  </script>
</head>
<body>
  <div id="app" role="status" aria-live="polite">Loading AI Tool Troubleshooting & Error Fix Hub...</div>
  <script>
    window.$docsify = {
      name: 'AIFixHub',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 3,
      coverpage: false,
      search: {
        placeholder: 'Search AI errors, tools, and fixes',
        noData: 'No matching troubleshooting guide found.',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.9.4/lib/docsify.min.js" integrity="sha384-1YUPxNziP3fgBVkncHzpaPSlip3iFzL5E0UqlMsewqkIllWNHSZ2Y68unqiNxmKq" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.9.4/lib/plugins/search.min.js" integrity="sha384-ZL5gmv8xo8Z8lH1kP1dZG/myO9XfIaLx24VNSClOK3igwcd+ERXmOFFD3LwHDKrm" crossorigin="anonymous"></script>
</body>
</html>
